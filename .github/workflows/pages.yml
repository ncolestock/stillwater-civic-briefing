name: Deploy paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render any weekly episode that has a script and no audio yet
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scripts/render_pending_audio.py
      - run: python3 scripts/validate_articles.py
      - run: python3 scripts/build_feed.py
      - run: npm run build
      - name: Keep rendered audio in the repo for the next deploy
        run: |
          git config user.name "stillwater-civic-briefing"
          git config user.email "nathan0colestock@gmail.com"
          git add episodes
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render weekly episode audio"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
